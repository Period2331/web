<main>
    <section id="home" class="active section-index">

        <div class="experience-banner-wrapper" id="bannerWrapper">

                        <span>信箱</span>
                        <span id="about-email-text"></span>

                </div>

                    <img id="about-profile-img" src="" alt="個人頭像" class="profile-img animate__animated animate__zoomIn">

                </div>
